[project]
name = "karatcore-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.14,<3",
    "svix>=1.41,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "pyright>=1.1.380", "ruff>=0.6", "httpx>=0.27"]

[tool.pyright]
include = ["app", "tests", "alembic", "api"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make isort treat the alembic package as first-party.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
